<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zurich Thai Massage</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

   <!-- From Uiverse.io by adamgiebl --> 
    <button class="cssbuttons-io-button">
    Check Backend
    <div class="icon">
        <svg
        height="24"
        width="24"
        viewBox="0 0 24 24"
        xmlns="http://www.w3.org/2000/svg"
        >
        <path d="M0 0h24v24H0z" fill="none"></path>
        <path
            d="M16.172 11l-5.364-5.364 1.414-1.414L20 12l-7.778 7.778-1.414-1.414L16.172 13H4v-2z"
            fill="currentColor"
        ></path>
        </svg>
    </div>
    </button>


    <p id="status"></p>

    <form id="bookingForm">
        <label for="fname">First Name</label>
        <input type="text" id="fname" name="firstname" placeholder="Your name..">

        <label for="lname">Last Name</label>
        <input type="text" id="lname" name="lastname" placeholder="Your last name..">

        <label for="massagetype">Massage Type</label>
        <select id="massagetype" name="massagetype">
            <option value="smassage">30min Massage</option>
            <option value="mmassage">60min Massage</option>
            <option value="lmassage">90min Massage</option>
        </select>
        
        <input type="submit" value="Buchen">
    </form>

    <script src="script.js"></script>
</body>
</html>
